<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trà Mây">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:#2B2240}</style>
<title>Quán Trà Mây</title>
<meta name="theme-color" content="#2B2240">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pangolin&family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#DDF1EA; --wall:#E9F7F1; --panel:#FFFFFF; --panel2:#F4FBF8;
  --ink:#2B2240; --soft:#6B6385; --line:#C7E3D8;
  --teal:#1F9E89; --teal-d:#15766A; --butter:#FFC94A; --butter-d:#E0A91F;
  --coral:#FF6F61; --plum:#6A4FB3; --ok:#2FA36B;
  --r:14px;
  --fd:"Pangolin","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  --fb:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
input,textarea{font:inherit;font-size:16px!important;-webkit-user-select:text;user-select:text}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;background:var(--wall)}

/* ---------- thanh trên ---------- */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);color:#fff;min-height:52px;flex:0 0 auto}
#top .ib{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 auto}
#top .ib svg{width:20px;height:20px}
#top .day{display:flex;flex-direction:column;line-height:1.1;min-width:0}
#top .day b{font-family:var(--fd);font-size:19px;font-weight:400}
#top .day small{font-size:11.5px;opacity:.75;white-space:nowrap}
#top .money{margin-left:auto;font-family:var(--fd);font-size:22px;color:var(--butter);font-variant-numeric:tabular-nums}
#top .rate{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
#top .rate i{color:var(--butter);font-style:normal}
#combo{position:absolute;top:58px;right:10px;z-index:6;background:var(--butter);color:var(--ink);font-family:var(--fd);font-size:17px;
  padding:3px 12px;border-radius:999px;box-shadow:0 3px 0 var(--butter-d);transform-origin:center}
#combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.3)}}

#screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

/* ---------- màn hình chào ---------- */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px;text-align:center;overflow:auto}
.splash h1{font-family:var(--fd);font-weight:400;font-size:46px;margin:0;line-height:1;color:var(--ink)}
.splash p{margin:0;color:var(--soft);max-width:30ch}
.splash .mascot{width:170px;max-width:60%}
.splash label{font-size:13px;color:var(--soft);display:block;margin-bottom:6px}
.splash input{width:min(280px,100%);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:center;font-weight:700}
.big{display:block;width:min(320px,100%);padding:15px 18px;border-radius:16px;background:var(--teal);color:#fff;font-weight:800;font-size:17px;box-shadow:0 5px 0 var(--teal-d)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--teal-d)}
.big[disabled]{background:#B9CFC8;box-shadow:0 5px 0 #9DB5AE;cursor:not-allowed}
.link{color:var(--teal-d);font-weight:700;text-decoration:underline;padding:6px}

/* ---------- chuẩn bị ---------- */
.prep{flex:1;overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.prep > *,.sum > *{flex-shrink:0}
.card{background:var(--panel);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.dayhead{display:flex;gap:12px;align-items:center}
.dayhead .ev{width:48px;height:48px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:0 0 auto}
.dayhead h2{margin:0;font-family:var(--fd);font-weight:400;font-size:22px}
.dayhead p{margin:2px 0 0;color:var(--soft);font-size:13.5px}
.sec{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 8px}
.mis{display:flex;flex-direction:column;gap:8px}
.mi{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14px}
.mi .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff}
.mi.done .ck{background:var(--ok);border-color:var(--ok)}
.mi.fail{opacity:.5}
.mi .rw{font-weight:800;color:var(--teal-d);font-variant-numeric:tabular-nums}
.mi .bar{grid-column:2/3;height:6px;background:var(--panel2);border-radius:6px;overflow:hidden}
.mi .bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{padding:9px 2px;white-space:nowrap;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:clamp(11.5px,3.5vw,13.5px);color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.it .sw{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel2)}
.it .nm{font-weight:700;font-size:14.5px}
.it .sub{font-size:12.5px;color:var(--soft);margin-top:1px}
.it.locked .nm{color:var(--soft)}
.buy{padding:9px 12px;border-radius:10px;background:var(--butter);box-shadow:0 3px 0 var(--butter-d);font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--butter-d)}
.buy.lock{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.buy[disabled]{background:#E4E9E7;box-shadow:none;color:#98A39F;cursor:not-allowed}
.owned{font-size:12.5px;font-weight:800;color:var(--ok)}
.stockpill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--panel2);font-weight:800;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.stockpill.zero{background:#FFE3DF;color:#B23A2E}
.cta{padding:12px 16px 14px;background:var(--wall);border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.cta small{color:var(--soft);font-size:12.5px;text-align:center}
.note{font-size:13px;color:var(--soft);margin:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:12px}
.bd .md{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:20px;color:#fff;background:var(--butter);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.bd b{display:block;font-size:12.5px;margin-bottom:2px}
.bd.off{opacity:.45}
.bd.off .md{background:#C9D3CF}
.hearts{color:var(--coral);letter-spacing:2px;font-size:13px}
.awn{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.awn button{width:40px;height:40px;border-radius:10px;border:3px solid transparent}
.awn button[aria-pressed="true"]{border-color:var(--ink)}

/* ---------- bán hàng ---------- */
.sell{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scene{position:relative;flex:1 1 auto;min-height:170px;overflow:hidden;
  background:linear-gradient(to top,#CDE6DB 0 30px,transparent 30px),repeating-linear-gradient(90deg,#D5EDE4 0 2px,transparent 2px 52px),#E9F7F1}
.awning{position:absolute;top:0;left:0;right:0;height:40px;background:repeating-linear-gradient(90deg,var(--awn) 0 22px,#fff 22px 44px)}
.awning:after{content:"";position:absolute;left:0;right:0;top:40px;height:12px;
  background:radial-gradient(circle at 11px 0,var(--awn) 10.5px,transparent 11.5px) 0 0/44px 12px repeat-x,radial-gradient(circle at 33px 0,#fff 10.5px,transparent 11.5px) 0 0/44px 12px repeat-x}
.lights{position:absolute;top:54px;left:0;right:0;display:flex;justify-content:space-around;border-top:1.5px solid #2B2240;padding-top:2px}
.lights i{width:8px;height:8px;border-radius:50%}
.wallsv{position:absolute;top:58px;left:0;width:100%;height:calc(100% - 58px)}
.deco{position:absolute;bottom:0}
.custs{position:absolute;inset:0}
.cust{position:absolute;bottom:6px;width:31%;display:flex;flex-direction:column;align-items:center;animation:walkin .45s ease-out}
.cust.out{animation:walkout .45s ease-in forwards}
@keyframes walkin{from{transform:translateY(24px);opacity:0}}
@keyframes walkout{to{transform:translateY(24px);opacity:0}}
.cust .face{width:80px;height:90px}
.cust .nm{font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px;margin-top:-4px;position:relative;z-index:1;white-space:nowrap}
.cust .pat{width:64px;height:6px;border-radius:6px;background:rgba(43,34,64,.15);overflow:hidden;margin-top:4px}
.cust .pat i{display:block;height:100%;width:100%;background:var(--ok);border-radius:6px}
.bubble{background:#fff;border-radius:14px;padding:6px 8px;box-shadow:0 2px 0 rgba(43,34,64,.12);font-size:11.5px;line-height:1.25;text-align:left;position:relative;margin-bottom:6px;min-width:84px;max-width:100%;display:flex;gap:6px;align-items:center}
.bubble:after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble svg{width:24px;height:32px;flex:0 0 auto}
.bubble b{display:block;font-size:12px}
.bubble .tp{color:var(--soft)}
.bubble .sg{display:inline-block;background:var(--butter);border-radius:6px;padding:0 5px;font-weight:800;color:var(--ink);margin-top:2px}
.say{position:absolute;top:-4px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;padding:4px 8px;border-radius:10px;white-space:nowrap;z-index:3;animation:fadeup 1.6s forwards}
@keyframes fadeup{0%{opacity:0;transform:translate(-50%,6px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.clock{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(43,34,64,.12)}
.clock i{display:block;height:100%;width:0;background:var(--butter)}
.closed{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}

.counter{flex:0 1 auto;min-height:0;display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 12px 12px;background:#F7EEDD;border-top:6px solid #C9A77C;overflow:auto}
.cupwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
#cup{width:92px;height:128px}
#cup.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px) rotate(-4deg)}75%{transform:translateX(5px) rotate(4deg)}}
.cuplbl{font-size:11px;text-align:center;color:var(--soft);line-height:1.3;min-height:28px}
.ctrl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctrl .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8A6F52}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ing{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:5px 4px;border-radius:12px;background:#fff;
  box-shadow:0 3px 0 #D9C4A4;font-size:12px;font-weight:700;line-height:1.1;text-align:center;touch-action:manipulation}
.ing.tea{touch-action:none}
.ing:active,.ing.on{transform:translateY(2px);box-shadow:0 1px 0 #D9C4A4}
.ing .dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(43,34,64,.18)}
.ing .n{position:absolute;top:3px;right:5px;font-size:10px;color:var(--soft);font-variant-numeric:tabular-nums}
.ing.empty{opacity:.4}
.ing.tea .dot{width:22px;height:14px;border-radius:4px 4px 8px 8px}
.ing.pour{background:#FFF6D8;box-shadow:0 1px 0 #D9C4A4;transform:translateY(2px)}
.sug{min-height:36px;flex-direction:row;gap:4px}
.sug.sel{background:var(--butter)}
.acts{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:2px}
.acts button{padding:12px 8px;border-radius:12px;font-weight:800;font-size:15px}
#trash{background:#fff;box-shadow:0 3px 0 #D9C4A4;color:#9A4B3F}
#serve{background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d)}
#serve:active,#trash:active{transform:translateY(2px);box-shadow:none}
#coach{flex:0 0 auto;margin:0;border-radius:0;background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.35;box-shadow:0 6px 18px rgba(43,34,64,.25)}
#coach b{color:var(--butter)}

/* ---------- tổng kết ---------- */
.sum{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sum h2{font-family:var(--fd);font-weight:400;font-size:28px;margin:0;text-align:center}
.rows{display:flex;flex-direction:column}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.rows div:last-child{border-bottom:0}
.rows span:last-child{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .tot{font-size:17px}
.pos{color:var(--ok)} .neg{color:#C4473A}
.starsbig{text-align:center;font-size:30px;color:var(--butter);letter-spacing:4px}

/* ---------- hộp thoại, thông báo ---------- */
#modal{position:fixed;inset:0;z-index:20;background:rgba(43,34,64,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 12px}
#sheet{width:100%;max-width:520px;max-height:86%;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet .big{width:100%}
#sheet h3{margin:0;font-family:var(--fd);font-weight:400;font-size:24px}
#sheet p{margin:0;color:var(--soft);line-height:1.5}
#sheet textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);padding:10px;font-size:12px;word-break:break-all}
#sheet input[type=text]{width:100%;padding:11px 12px;border-radius:12px;border:2px solid var(--line);font-weight:700}
.opt{display:flex;gap:6px}
.opt button{flex:1;padding:10px 6px;border-radius:10px;border:2px solid var(--line);font-weight:700;font-size:13.5px}
.opt button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row2{display:flex;gap:8px}
.row2 > *{flex:1}
.sbtn{padding:11px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px}
.sbtn.danger{background:#FFE9E6;border-color:#F4C2BB;color:#A83A2E}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#toast.good{background:var(--ok)} #toast.bad{background:#C4473A} #toast.gold{background:var(--butter);color:var(--ink)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.float{position:absolute;font-family:var(--fd);font-size:22px;color:var(--teal-d);text-shadow:0 2px 0 #fff;animation:rise 1.1s ease-out forwards;white-space:nowrap}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.5s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.twk{animation:twk 1.6s infinite alternate}
@keyframes twk{from{opacity:.35}}
@media (max-height:720px){
  .ing{min-height:40px;padding:3px}.ing .dot{width:14px;height:14px}.ing.tea .dot{width:18px;height:11px}
  .sug{min-height:32px}.acts button{padding:10px 8px}.cust .face{width:64px;height:72px}
  .bubble{font-size:10.5px;padding:4px 6px}.bubble b{font-size:11px}.bubble svg{width:18px;height:24px}
  #cup{width:80px;height:112px}.counter{grid-template-columns:84px 1fr}}
#rot{position:fixed;inset:0;z-index:40;background:var(--ink);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:17px}
#rot svg{width:64px;height:64px}
@media (orientation:landscape) and (max-height:500px){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="screen"></main>
</div>
<div id="modal" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fx"></div>
<div id="rot" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="#FFC94A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><b>Xoay dọc điện thoại để chơi nhé</b><span style="opacity:.75;font-size:14px">Quán Trà Mây chơi đẹp nhất khi cầm dọc.</span></div>

<script>
(function(){
"use strict";
/* ===================== DỮ LIỆU ===================== */
/* id, tên, tên ngắn, màu, vốn mỗi ly, giá bán, giá mở khóa */
const TEAS=[
  ['tra_sua','Trà sữa','Trà sữa','#C69C6D',5000,25000,0],
  ['tra_xanh','Trà xanh nhài','Trà xanh','#B7CF7A',4000,22000,0],
  ['matcha','Matcha sữa','Matcha','#7DB35A',7000,32000,250000],
  ['tra_thai','Trà Thái đỏ','Trà Thái','#E8863C',6000,30000,350000],
  ['tra_dao','Trà đào','Trà đào','#F2A860',6000,30000,450000],
  ['socola','Sô-cô-la sữa','Sô-cô-la','#7A4E36',6000,30000,550000]
].map(a=>({id:a[0],n:a[1],s:a[2],c:a[3],cost:a[4],price:a[5],unlock:a[6],kind:'tea'}));
const TOPS=[
  ['tran_chau','Trân châu đen','T.châu đen','#3A2A2A',2000,7000,0],
  ['thach_dua','Thạch dừa','Thạch dừa','#F3F0E2',2000,6000,0],
  ['pudding','Pudding trứng','Pudding','#F6D56E',3000,9000,200000],
  ['tc_trang','Trân châu trắng','T.châu trắng','#E9E2D0',3000,8000,250000],

function makeMissions(d){
  const rw=b=>Math.round((b+d*4000)/5000)*5000;
  if(d===1)return [{t:'serve',n:5,r:30000},{t:'perfect',n:2,r:30000},{t:'earn',n:100000,r:40000}];
  const teas=TEAS.filter(t=>S.unl[t.id]);
  const pool=[
    ()=>({t:'serve',n:Math.min(30,6+d),r:rw(25000)}),
    ()=>({t:'combo',n:Math.min(12,3+Math.floor(d/2)),r:rw(30000)}),
    ()=>({t:'perfect',n:Math.min(15,3+Math.floor(d/2)),r:rw(30000)}),
    ()=>({t:'tea',arg:rnd(teas).id,n:Math.min(10,3+Math.floor(d/3)),r:rw(25000)}),
    ()=>({t:'earn',n:Math.round((150000+d*30000)/10000)*10000,r:rw(35000)}),
    ()=>({t:'noleave',n:8,r:rw(40000)})
  ];
  const idx=[0,1,2,3,4,5].sort(()=>Math.random()-.5).slice(0,3);
  return idx.map(i=>pool[i]());
}

  const seq={coin:[880,1318],ok:[660,990],bad:[233,175],combo:[660,880,1108,1318],mission:[523,659,784,1046,1318],tap:[520],ting:[1568]}[type]||[440];

  seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*.085;o.type=type==='bad'?'square':'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='tap'?.05:.14,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.2);

};

/* ===================== THANH TRÊN ===================== */
function head(){const t=$('top');
  if(S.phase==='splash'){t.innerHTML=`<div class="day"><b>Quán Trà Mây</b><small>Trò chơi của cả nhà</small></div>`;return}
  const selling=S.phase==='sell';
  t.innerHTML=`<button class="ib" id="hBtn" aria-label="${selling?'Tạm dừng':'Cài đặt'}">${selling?ICON.pause:ICON.menu}</button>
    <div class="day"><b>Ngày ${S.phase==='summary'?S.day-1:S.day}</b><small id="hSub">${selling?'8:00':esc(S.name)}</small></div>
    <div class="money" id="hMoney">${fmt(S.money)}</div>
    <div class="rate" aria-label="Đánh giá"><i>★</i><span id="hRate">${rtxt()}</span></div>`;
  $('hBtn').onclick=()=>{snd('tap');selling?pauseDlg():settingsDlg()}}
function headMoney(){const m=$('hMoney');if(m)m.textContent=fmt(S.money);const r=$('hRate');if(r)r.textContent=rtxt()}

/* ===================== MÀN HÌNH CHÀO ===================== */
function renderSplash(){S.phase='splash';head();
  $('screen').innerHTML=`<div class="splash">
    <div class="mascot">${mascot(false)}</div>
    <h1>Quán Trà Mây</h1>
    <p>Rót trà, đón khách, mở một quán nhỏ thật xinh của riêng bạn.</p>
    ${S.started?`<p><b>${esc(S.name)}</b> · Ngày ${S.day} · ${fmt(S.money)}</p>`:`<div><label for="nameIn">Đặt tên quán của bạn</label><input id="nameIn" type="text" maxlength="24" value="${esc(S.name)}"></div>`}
    <button class="big" id="goBtn">${S.started?'Vào quán':'Mở quán'}</button>
    <button class="link" id="howBtn">Cách chơi</button>
    ${S.started?'':'<button class="link" id="resBtn">Có mã sao lưu? Khôi phục</button>'}
  </div>`;
  $('goBtn').onclick=()=>{snd('ok');if(!S.started){const v=($('nameIn').value||'').trim();S.name=v||'Quán Trà Mây';S.started=true;newDay()}
    if(S.sum)renderSummary();else renderPrep()};
  $('howBtn').onclick=howDlg;
  if($('resBtn'))$('resBtn').onclick=restoreDlg;}

/* ===================== CHUẨN BỊ ===================== */
let tab='kho';
function renderPrep(){S.phase='prep';S.sum=null;save();head();
  const ev=EVENTS[S.event];const evd=ev.d.replace('%',S.hotTea?ITEMS[S.hotTea].n.toLowerCase():'');
  const hasTea=TEAS.some(t=>S.stock[t.id]>0);
  $('screen').innerHTML=`<div class="prep" id="prepBox">
    <div class="card dayhead"><div class="ev">${ICON[ev.ic]}</div><div><h2>${esc(ev.n)}</h2><p>${esc(evd)}</p></div></div>
    <div class="card"><div class="sec">Nhiệm vụ hôm nay</div><div class="mis">${S.missions.map(m=>misRow(m)).join('')}</div></div>
    ${lvlNote()}
    <div class="tabs" role="tablist">${[['kho','Nguyên liệu'],['trangbi','Trang bị'],['trangtri','Trang trí'],['sotay','Sổ tay']].map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${n}</button>`).join('')}</div>
    <div id="tabBody">${tabBody()}</div>
  </div>
  <div class="cta"><button class="big" id="openBtn" ${hasTea?'':'disabled'}>Mở cửa ngày ${S.day}</button>
    <small>${hasTea?(S.upg.tu_mat?'Trà thừa cuối ngày được cất tủ mát.':'Trà nấu rồi mà tối chưa bán hết thì phải đổ bỏ. Topping để được.'):'Nấu ít nhất một mẻ trà để mở cửa.'}</small></div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;snd('tap');renderPrep()});
  $('openBtn').onclick=()=>{snd('ok');startDay()};
  bindTab();}
function lvlNote(){const L=lvl(S.day);const next=L===1?`Từ ngày 4, khách gọi tới 2 topping.`:L===2?`Từ ngày 8, khách chọn cả mức đường.`:'';
  const now=L===1?'Khách gọi trà và tối đa 1 topping.':L===2?'Khách gọi trà và tối đa 2 topping.':'Khách gọi trà, tối đa 2 topping và mức đường.';
  return `<p class="note"><b>Cấp ${L}:</b> ${now} ${next}</p>`}
function misRow(m){const p=misProg(m),pct=Math.min(100,Math.round(p/m.n*100));
  const failed=m.t==='noleave'&&S.today.left>0&&!m.done;
  return `<div class="mi ${m.done?'done':''} ${failed?'fail':''}"><span class="ck">${m.done?'✓':''}</span><span>${esc(misLabel(m))}</span><span class="rw">+${fmt(m.r)}</span><span></span><span class="bar"><i style="width:${m.done?100:pct}%"></i></span></div>`}
function tabBody(){
  if(tab==='kho'){
    const row=i=>{if(!S.unl[i.id])return `<div class="it locked"><div class="sw">${i.kind==='tea'?cupSvg(i.id,[],1):dotSw(i.c)}</div><div><div class="nm">${esc(i.n)}</div><div class="sub">Bán ${fmt(i.price)}${i.kind==='top'?' mỗi phần':' mỗi ly'}</div></div><button class="buy lock" data-unl="${i.id}" ${S.money<i.unlock?'disabled':''}>Mở khóa ${fmt(i.unlock)}</button></div>`;
      const st=S.stock[i.id];return `<div class="it"><div class="sw">${i.kind==='tea'?cupSvg(i.id,[],1):dotSw(i.c)}</div><div><div class="nm">${esc(i.n)} <span class="stockpill ${st?'':'zero'}">còn ${st}</span></div><div class="sub">Vốn ${fmt(i.cost)} · bán ${fmt(i.price)}</div></div><button class="buy" data-buy="${i.id}" ${S.money<i.cost*PACK?'disabled':''}>${i.kind==='tea'?'Nấu':'Nhập'} ${PACK} · ${fmt(i.cost*PACK)}</button></div>`};
    const help=(S.money<60000&&!TEAS.some(t=>S.stock[t.id]>0))?`<div class="card"><p class="note">Két gần hết tiền rồi. Nhà cho mượn một ít vốn để làm lại nhé.</p><button class="buy" id="loanBtn" style="margin-top:8px">Nhận 200k vốn từ nhà</button></div>`:'';
    return `${help}<div class="sec" style="margin-top:4px">Trà (mỗi mẻ ${PACK} ly)</div><div class="list">${TEAS.map(row).join('')}</div>
      <div class="sec" style="margin-top:14px">Topping (mỗi gói ${PACK} phần)</div><div class="list">${TOPS.map(row).join('')}</div>`}
  if(tab==='trangbi')return `<div class="list">${UPGS.map(u=>`<div class="it"><div class="sw">${ICON.star}</div><div><div class="nm">${esc(u.n)}</div><div class="sub">${esc(u.d)}</div></div>${S.upg[u.id]?'<span class="owned">Đã có</span>':`<button class="buy" data-upg="${u.id}" ${S.money<u.p?'disabled':''}>${fmt(u.p)}</button>`}</div>`).join('')}</div>`;
  if(tab==='trangtri')return `<p class="note" style="margin-bottom:10px">Mỗi món trang trí làm quán đông khách hơn một chút.</p>
    <div class="list">${DECOR.map(d=>`<div class="it"><div class="sw">${ICON.star}</div><div><div class="nm">${esc(d.n)}</div></div>${S.decor[d.id]?'<span class="owned">Đã có</span>':`<button class="buy" data-dec="${d.id}" ${S.money<d.p?'disabled':''}>${fmt(d.p)}</button>`}</div>`).join('')}</div>
    <div class="card" style="margin-top:10px"><div class="sec">Màu mái hiên</div><div class="awn">${Object.entries(AWN).map(([k,a])=>`<button aria-label="${a.n}" aria-pressed="${S.awn===k}" data-awn="${k}" style="background:${a.c}"></button>`).join('')}</div>
    <p class="note" style="margin-top:8px">${Object.entries(AWN).filter(([k])=>!S.awnOwn[k]).map(([k,a])=>`${a.n}: ${fmt(a.p)}`).join(' · ')||'Bạn có đủ các màu rồi.'}</p></div>`;
  if(tab==='sotay'){const got=Object.keys(S.badges).length;
    return `<div class="card"><div class="sec">Khách quen</div><div class="list">${REGS.map(r=>{const v=S.reg[r.id]||0;const met=v>0;
      return `<div class="it" style="border:0;padding:4px 0"><div class="sw" style="background:none">${met?faceSvg(r.lk,'happy'):'<svg viewBox="0 0 40 40" width="36"><circle cx="20" cy="20" r="16" fill="#E4E9E7"/><text x="20" y="26" text-anchor="middle" font-size="16" fill="#98A39F">?</text></svg>'}</div>
        <div><div class="nm">${met?esc(r.n):'Chưa gặp'}</div><div class="sub">${met?'Hay gọi '+esc(ITEMS[r.o.tea].n.toLowerCase())+(r.o.tops.length?' + '+r.o.tops.map(t=>ITEMS[t].n.toLowerCase()).join(', '):''):'Mở thêm món để gặp khách mới'}</div></div>
        <div class="hearts" aria-label="${Math.min(v,3)} trên 3 lần ghé">${'♥'.repeat(Math.min(v,3))}${'♡'.repeat(3-Math.min(v,3))}${v>=3?'<div class="owned" style="font-size:11px">Khách ruột</div>':''}</div></div>`}).join('')}</div></div>
      <div class="card"><div class="sec">Huy hiệu ${got}/${BADGES.length}</div><div class="badges">${BADGES.map(b=>`<div class="bd ${S.badges[b.id]?'':'off'}"><div class="md">${b.g}</div><b>${esc(b.n)}</b>${esc(b.d)}</div>`).join('')}</div></div>
      <div class="card"><div class="sec">Thành tích</div><div class="rows">
        <div><span>Tổng số ly đã bán</span><span>${S.stats.served}</span></div>
        <div><span>Ly rót hoàn hảo</span><span>${S.stats.perfect}</span></div>
        <div><span>Chuỗi dài nhất</span><span>${S.stats.bestCombo}</span></div>
        <div><span>Tổng tiền thu về</span><span>${fmt(S.stats.earned)}</span></div></div></div>`}
  return ''}
const dotSw=c=>`<svg viewBox="0 0 40 40" width="34"><circle cx="13" cy="24" r="7" fill="${c}" stroke="rgba(0,0,0,.2)"/><circle cx="27" cy="24" r="7" fill="${c}" stroke="rgba(0,0,0,.2)"/><circle cx="20" cy="13" r="7" fill="${c}" stroke="rgba(0,0,0,.2)"/></svg>`;
function spend(v,invest){S.money-=v;if(invest)S.today.invest+=v;else S.today.spent+=v}
function bindTab(){
  const keep=()=>{const b=$('prepBox');const y=b?b.scrollTop:0;renderPrep();const n=$('prepBox');if(n)n.scrollTop=y};
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=ITEMS[b.dataset.buy],v=i.cost*PACK;if(S.money<v)return;spend(v);S.stock[i.id]+=PACK;snd('coin');buzz(10);keep()});
  document.querySelectorAll('[data-unl]').forEach(b=>b.onclick=()=>{const i=ITEMS[b.dataset.unl];if(S.money<i.unlock)return;spend(i.unlock,1);S.unl[i.id]=true;snd('mission');toast('Đã mở khóa '+i.n+'!','good');checkBadges();keep()});
  document.querySelectorAll('[data-upg]').forEach(b=>b.onclick=()=>{const u=UPGS.find(x=>x.id===b.dataset.upg);if(S.money<u.p)return;spend(u.p,1);S.upg[u.id]=1;snd('mission');toast('Đã lắp '+u.n,'good');keep()});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const d=DECOR.find(x=>x.id===b.dataset.dec);if(S.money<d.p)return;spend(d.p,1);S.decor[d.id]=1;snd('mission');toast('Quán thêm '+d.n.toLowerCase()+'!','good');checkBadges();keep()});
  document.querySelectorAll('[data-awn]').forEach(b=>b.onclick=()=>{const k=b.dataset.awn,a=AWN[k];
    if(!S.awnOwn[k]){if(S.money<a.p){toast('Chưa đủ tiền mua màu '+a.n,'bad');return}spend(a.p,1);S.awnOwn[k]=1;snd('coin')}S.awn=k;keep()});
  if($('loanBtn'))$('loanBtn').onclick=()=>{S.money+=200000;snd('coin');toast('Đã nhận 200k vốn. Cố lên!','good');keep()};
}

/* ===================== BÁN HÀNG ===================== */
let R=null;
function zone(){return S.upg.vach?[74,94]:[78,90]}
function patienceMax(){const ev=EVENTS[S.event];return Math.max(28,48-S.day*.8)*pace().pat*ev.pat*(S.upg.ghe?1.25:1)}
function spawnGap(){const ev=EVENTS[S.event],r=rating();const rf=r>=4.5?1.15:r<3.5?.8:1;
  const base=Math.max(4.2,10.5-S.day*.45);return base/(ev.mul*(S.upg.loa?1.15:1)*(1+.04*decorCount())*rf)*(.75+Math.random()*.5)}
function newCup(){return {tea:null,fill:0,tops:[],sugar:null}}

function startDay(){
  S.phase='sell';save();
  R={t:0,next:1.2,custs:[],combo:0,cup:newCup(),pouring:null,last:performance.now(),raf:0,paused:false,uid:0,closedShown:false,ended:false};
  head();
  const L=lvl(S.day);
  $('screen').innerHTML=`<div class="sell">
    <div class="scene" id="scene">${sceneSvg()}<div class="custs" id="custs"></div>
      <div class="clock"><i id="clk"></i></div></div>
    <div id="coach" hidden></div>
    <div class="counter">
      <div class="cupwrap"><div id="cup">${cupSvg(null,[])}</div><div class="cuplbl" id="cupLbl">Ly trống</div></div>
      <div class="ctrl">
        <div class="lbl">Giữ tay để rót trà</div><div class="grid3" id="teaRow"></div>
        <div class="lbl">Chạm để thêm topping</div><div class="grid3" id="topRow"></div>
        ${L>=3?`<div class="lbl">Mức đường</div><div class="grid3" id="sugRow">${[30,50,100].map(v=>`<button class="ing sug" data-sug="${v}">${v}%</button>`).join('')}</div>`:''}
        <div class="acts"><button id="trash">Đổ ly</button><button id="serve">Giao ly</button></div>
      </div>
    </div>
  </div>`;
  buildButtons();drawCup();
  $('trash').onclick=()=>{if(!R.cup.tea&&!R.cup.tops.length){toast('Ly đang trống');return}R.cup=newCup();snd('bad');drawCup();toast('Đã đổ ly, pha lại nhé')};
  $('serve').onclick=serve;
  document.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{R.cup.sugar=+b.dataset.sug;snd('tap');buzz(8);drawCup()});
  R.raf=requestAnimationFrame(loop);
  if(!S.tut)coach();
}
function buildButtons(){
  const teaRow=$('teaRow'),topRow=$('topRow');
  teaRow.innerHTML=TEAS.filter(t=>S.unl[t.id]).map(t=>`<button class="ing tea ${S.stock[t.id]?'':'empty'}" data-tea="${t.id}" aria-label="Rót ${t.n}, còn ${S.stock[t.id]} ly"><span class="n">${S.stock[t.id]}</span><span class="dot" style="background:${t.c}"></span>${esc(t.s)}</button>`).join('');
  topRow.innerHTML=TOPS.filter(t=>S.unl[t.id]).map(t=>`<button class="ing ${S.stock[t.id]?'':'empty'}" data-top="${t.id}" aria-label="Thêm ${t.n}, còn ${S.stock[t.id]} phần"><span class="n">${S.stock[t.id]}</span><span class="dot" style="background:${t.c}"></span>${esc(t.s)}</button>`).join('');
  teaRow.querySelectorAll('[data-tea]').forEach(b=>{const id=b.dataset.tea;
    const down=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}startPour(id,b)};
    const up=()=>stopPour();
    b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();startPour(id,b)}});
    b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stopPour()});});
  topRow.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>addTop(b.dataset.top));
}
function refreshCounts(){document.querySelectorAll('[data-tea],[data-top]').forEach(b=>{const id=b.dataset.tea||b.dataset.top;b.querySelector('.n').textContent=S.stock[id];b.classList.toggle('empty',!S.stock[id])})}
function consume(id){S.stock[id]--;refreshCounts();
  if(S.stock[id]===0){let spare=(id===R.cup.tea||R.cup.tops.includes(id))?1:0;
    R.custs.filter(c=>!c.gone&&(c.o.tea===id||c.o.tops.includes(id))).forEach(c=>{if(spare){spare=0;return}
      const o=genOrder();if(o){c.o=o;renderCust(c);say(c,'Hết món rồi hả? Vậy đổi món nha')}else leave(c,'soldout')})}}
function startPour(id,btn){if(R.paused||R.ended)return;
  const c=R.cup;if(c.tea&&c.tea!==id){toast('Ly này đã có '+ITEMS[c.tea].s.toLowerCase()+'. Đổ ly nếu muốn đổi.','bad');snd('bad');return}
  if(!c.tea){if(S.stock[id]<=0){toast('Hết '+ITEMS[id].n.toLowerCase()+' rồi','bad');snd('bad');return}consume(id);c.tea=id;drawCup()}
  R.pouring=id;R.pourBtn=btn;btn.classList.add('pour');buzz(12)}
function stopPour(){if(!R||!R.pouring)return;R.pouring=null;if(R.pourBtn)R.pourBtn.classList.remove('pour');
  const [lo,hi]=zone();if(R.cup.fill>=lo&&R.cup.fill<=hi){snd('ting');buzz(25)}drawCup();coach()}
function addTop(id){if(R.paused||R.ended)return;const c=R.cup;
  if(c.tops.includes(id)){toast('Ly đã có '+ITEMS[id].n.toLowerCase());return}
  if(c.tops.length>=3){toast('Ly đầy topping rồi');return}
  if(S.stock[id]<=0){toast('Hết '+ITEMS[id].n.toLowerCase()+' rồi','bad');snd('bad');return}
  consume(id);c.tops.push(id);snd('tap');buzz(8);drawCup();coach()}
function drawCup(){const c=R.cup,[lo,hi]=zone();
  const yOf=f=>132-110*f/100;
  $('cup').innerHTML=`<svg viewBox="0 0 100 140" aria-hidden="true"><defs><clipPath id="ccm"><path d="M20 22H80L73 132H27Z"/></clipPath></defs>
    <g clip-path="url(#ccm)"><rect x="0" y="0" width="100" height="140" fill="#fff"/>
      <rect id="liq" x="0" y="${yOf(c.fill)}" width="100" height="${140-yOf(c.fill)}" fill="${c.tea?ITEMS[c.tea].c:'none'}"/>
      ${c.tops.filter(t=>t!=='kem_cheese').map((t,i)=>{let o='';for(let k=0;k<4;k++)o+=`<circle cx="${32+k*12+(i%2)*5}" cy="${126-i*8-(k%2)*3}" r="4.5" fill="${ITEMS[t].c}" stroke="rgba(0,0,0,.18)"/>`;return o}).join('')}
      <rect x="0" y="${yOf(hi)}" width="100" height="${yOf(lo)-yOf(hi)}" fill="#2FA36B" opacity=".13"/>
      ${c.tops.includes('kem_cheese')?`<rect id="crm" x="0" y="${Math.min(yOf(c.fill),126)-6}" width="100" height="8" fill="#FFF1B8" stroke="#E9D78C"/>`:''}
    </g>
    <g stroke="#2FA36B" stroke-width="3" stroke-linecap="round"><path d="M82 ${yOf(hi)}h8M82 ${yOf(lo)}h8"/><path d="M86 ${yOf(hi)}V${yOf(lo)}" stroke-width="2"/></g>
    <path d="M20 22H80L73 132H27Z" fill="none" stroke="#2B2240" stroke-width="4" stroke-linejoin="round"/></svg>`;
  const parts=[];if(c.tea)parts.push(ITEMS[c.tea].s+' '+Math.round(c.fill)+'%');c.tops.forEach(t=>parts.push(ITEMS[t].s));if(c.sugar)parts.push('Đường '+c.sugar+'%');
  $('cupLbl').textContent=parts.length?parts.join(' · '):'Ly trống';
  document.querySelectorAll('[data-sug]').forEach(b=>b.classList.toggle('sel',+b.dataset.sug===c.sugar))}
function liqOnly(){const l=$('liq');if(!l)return;const y=132-110*R.cup.fill/100;l.setAttribute('y',y);l.setAttribute('height',140-y);
  const cr=$('crm');if(cr)cr.setAttribute('y',Math.min(y,126)-6);
  $('cupLbl').textContent=[ITEMS[R.cup.tea].s+' '+Math.round(R.cup.fill)+'%'].concat(R.cup.tops.map(t=>ITEMS[t].s)).concat(R.cup.sugar?['Đường '+R.cup.sugar+'%']:[]).join(' · ')}

function genOrder(){
  const teas=TEAS.filter(t=>S.unl[t.id]&&S.stock[t.id]>0);if(!teas.length)return null;
  const w=teas.map(t=>t.id===S.hotTea?4:1),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,tea=teas[0].id;
  for(let i=0;i<teas.length;i++){r-=w[i];if(r<=0){tea=teas[i].id;break}}
  const L=lvl(S.day);const pool=TOPS.filter(t=>S.unl[t.id]&&S.stock[t.id]>0).map(t=>t.id).sort(()=>Math.random()-.5);
  const n=L===1?(Math.random()<.6?1:0):rnd([0,1,1,2,2]);
  return {tea,tops:pool.slice(0,Math.min(n,pool.length)),sugar:L>=3?rnd([30,50,100]):null}}
function avail(o){return S.unl[o.tea]&&S.stock[o.tea]>0&&o.tops.every(t=>S.unl[t]&&S.stock[t]>0)}
function freeSlot(){for(let i=0;i<3;i++)if(!R.custs.some(c=>c.slot===i))return i;return -1}
function spawn(){const slot=freeSlot();if(slot<0)return;
  let reg=null;if(Math.random()<.28){const cands=REGS.filter(r=>avail(r.o)&&!R.custs.some(c=>c.reg===r.id));if(cands.length)reg=rnd(cands)}
  let o=reg?{tea:reg.o.tea,tops:reg.o.tops.slice(),sugar:lvl(S.day)>=3?reg.sugar:null}:genOrder();if(!o)return;
  const mp=patienceMax();
  const c={id:++R.uid,slot,reg:reg?reg.id:null,name:reg?reg.n:null,lk:reg?reg.lk:randLook(),o,p:mp,mp,mood:'happy',gone:false};
  R.custs.push(c);renderCust(c,true);snd('tap');coach();
  if(reg&&(S.reg[reg.id]||0)>=1)setTimeout(()=>say(c,reg.hi),300)}
function orderHtml(o){return `${cupSvg(o.tea,o.tops,1)}<div><b>${esc(ITEMS[o.tea].s)}</b>${o.tops.map(t=>`<div class="tp">+ ${esc(ITEMS[t].s)}</div>`).join('')}${o.sugar?`<span class="sg">Đường ${o.sugar}%</span>`:''}</div>`}
function renderCust(c,isNew){let el=c.el;
  if(!el){el=document.createElement('div');el.className='cust';el.style.left=(2+c.slot*31.5)+'%';$('custs').appendChild(el);c.el=el}
  el.innerHTML=`<div class="bubble">${orderHtml(c.o)}</div>${faceSvg(c.lk,c.mood)}${c.name?`<div class="nm">${esc(c.name)}${(S.reg[c.reg]||0)>=3?' ♥':''}</div>`:''}<div class="pat"><i></i></div>`;
  c.bar=el.querySelector('.pat i');}
function say(c,txt){if(!c.el)return;const s=document.createElement('div');s.className='say';s.textContent=txt;c.el.appendChild(s);setTimeout(()=>s.remove(),1700)}
function leave(c,why){if(c.gone)return;c.gone=true;
  if(why==='timeout'){S.ratings.push(1);S.today.left++;S.today.stars.push(1);R.combo=0;comboUi();snd('bad');buzz([30,40,30]);say(c,'Chờ lâu quá, thôi về!');addReview(1)}
  if(why==='soldout'){S.ratings.push(3);S.today.left++;S.today.stars.push(3);say(c,'Hết món mình thích rồi…')}
  trimRatings();headMoney();
  setTimeout(()=>{if(c.el){c.el.classList.add('out');setTimeout(()=>{c.el&&c.el.remove()},450)}R.custs=R.custs.filter(x=>x!==c)},why==='served'?500:900)}
function trimRatings(){if(S.ratings.length>40)S.ratings=S.ratings.slice(-40)}
function addReview(){}

function sameTops(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function matches(o){const c=R.cup;return c.tea===o.tea&&sameTops(c.tops,o.tops)&&(!o.sugar||c.sugar===o.sugar)}
function serve(){if(R.paused||R.ended)return;const c=R.cup;
  if(!c.tea){toast('Rót trà vào ly trước đã');snd('bad');return}
  if(c.fill<8){toast('Ly còn gần như trống, giữ tay lâu hơn để rót');snd('bad');return}
  const alive=R.custs.filter(x=>!x.gone);if(!alive.length){toast('Chưa có khách nào');return}
  const ok=alive.filter(x=>matches(x.o)).sort((a,b)=>a.p/a.mp-b.p/b.mp);
  if(!ok.length){const t=alive.slice().sort((a,b)=>a.p/a.mp-b.p/b.mp)[0];
    const why=c.tea!==t.o.tea?'Sai loại trà rồi':!sameTops(c.tops,t.o.tops)?'Topping chưa đúng':c.sugar?'Sai mức đường':'Chưa chọn mức đường';
    say(t,why+'!');t.p=Math.max(1,t.p-t.mp*.2);R.combo=0;comboUi();R.cup=newCup();drawCup();snd('bad');buzz([40,30,40]);
    $('cup').classList.remove('shake');void $('cup').offsetWidth;$('cup').classList.add('shake');toast(why+'. Ly bị đổ, pha lại nhé.','bad');return}
  const cu=ok[0],[lo,hi]=zone();const mid=(lo+hi)/2,tol=S.upg.vach?3.5:2.5;
  const base=ITEMS[c.tea].price+c.tops.reduce((a,t)=>a+ITEMS[t].price,0);
  let stars,tip=0,msg,perfect=false;const waitLong=cu.p/cu.mp<.25;
  const tipBase=(3000+Math.floor(Math.random()*5)*1000)*(S.upg.hu_tip?1.5:1)*pace().tip;
  if(c.fill<lo){stars=3;msg='Ly hơi vơi';R.combo=0}
  else if(c.fill>hi){stars=4;tip=tipBase*.5;msg='Hơi đầy xíu';R.combo++}
  else{perfect=Math.abs(c.fill-mid)<=tol;stars=waitLong?4:5;tip=tipBase*(perfect?2:1);msg=perfect?'Hoàn hảo!':waitLong?'Ngon, mà chờ hơi lâu':'Ngon quá!';R.combo++}
  let regBonus=0;
  if(cu.reg){const v=(S.reg[cu.reg]||0)+1;S.reg[cu.reg]=v;if(v>3)regBonus=8000;if(v===3){setTimeout(()=>{toast(cu.name+' thành khách ruột của quán!','gold',2600);confetti();snd('mission')},400)}}
  const comboBonus=Math.round(base*Math.min(R.combo,10)*.03/1000)*1000;
  tip=Math.round(tip/1000)*1000;const total=base+tip+regBonus+comboBonus;
  S.money+=total;S.stats.earned+=total;S.stats.served++;S.today.served++;S.today.rev+=total;
  S.today.teaSold[c.tea]=(S.today.teaSold[c.tea]||0)+1;
  if(perfect){S.stats.perfect++;S.today.perfect++}
  S.today.bestCombo=Math.max(S.today.bestCombo,R.combo);S.stats.bestCombo=Math.max(S.stats.bestCombo,R.combo);
  S.ratings.push(stars);S.today.stars.push(stars);trimRatings();
  cu.mood='happy';renderCust(cu);say(cu,msg);floatAt(cu.el,'+'+fmt(total));
  snd(perfect?'coin':'ok');buzz(perfect?[20,40,20]:20);
  if(R.combo>=3&&R.combo%5===0){snd('combo');confetti();toast('Chuỗi '+R.combo+' ly! Thưởng thêm tiền','gold')}
  comboUi(true);
  if(!S.tut){S.tut=true;setTimeout(()=>toast('Giỏi lắm! Giờ bạn tự pha tiếp nhé','good',2400),600)}
  R.cup=newCup();drawCup();leave(cu,'served');headMoney();
  checkMissions();checkBadges();save();coach()}
function comboUi(bump){let el=$('combo');
  if(!R||R.combo<2){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='combo';$('app').appendChild(el)}
  el.textContent='Chuỗi ×'+R.combo;if(bump){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}}
function checkMissions(){S.missions.forEach(m=>{if(m.done||m.t==='noleave')return;if(misProg(m)>=m.n)completeMission(m)})}
function completeMission(m){m.done=true;S.money+=m.r;S.today.bonus+=m.r;S.stats.missions++;headMoney();
  setTimeout(()=>{toast('Xong nhiệm vụ: '+misLabel(m)+' (+'+fmt(m.r)+')','gold',2600);snd('mission');confetti()},250)}
function checkBadges(extra){BADGES.forEach(b=>{if(S.badges[b.id])return;if(b.c(S)||(extra&&extra===b.id)){S.badges[b.id]=S.day;
  if(S.today)(S.today.newB=S.today.newB||[]).push(b.id);setTimeout(()=>{toast('Huy hiệu mới: '+b.n,'gold',2600);confetti();snd('mission')},900)}})}

function coach(){const el=$('coach');if(!el)return;if(S.tut||S.phase!=='sell'){el.hidden=true;return}
  const c=R.cup,[lo,hi]=zone(),alive=R.custs.filter(x=>!x.gone);let t='';
  if(!alive.length)t='Chờ chút, khách sắp tới rồi. Khách gọi món nào sẽ hiện trong bong bóng trên đầu.';
  else{const o=alive[0].o;
    if(!c.tea)t=`<b>Bước 1:</b> Chạm và <b>giữ tay</b> lên nút <b>${esc(ITEMS[o.tea].s)}</b>. Thả tay khi trà dâng tới <b>vùng xanh</b> trên ly.`;
    else if(c.fill<lo)t='<b>Giữ tay thêm</b> lên nút trà để rót tiếp tới vùng xanh.';
    else if(!sameTops(c.tops,o.tops)&&o.tops.length)t=`<b>Bước 2:</b> Chạm <b>${o.tops.map(x=>esc(ITEMS[x].s)).join(', ')}</b> để thêm topping.`;
    else t='<b>Bước 3:</b> Bấm <b>Giao ly</b> để đưa cho khách.';}
  el.innerHTML=t;el.hidden=false}

function loop(ts){if(!R||R.ended)return;const dt=Math.min(.1,(ts-R.last)/1000);R.last=ts;
  if(!R.paused){R.t+=dt;
    if(R.t<DAY_LEN){R.next-=dt;if(R.next<=0){spawn();R.next=S.day===1&&S.today.served<2?Math.max(spawnGap(),9):spawnGap()}}
    else if(!R.closedShown){R.closedShown=true;const b=document.createElement('div');b.className='closed';b.textContent='Đã đóng cửa · làm nốt cho khách';$('scene').appendChild(b)}
    const coachWait=!S.tut;
    R.custs.forEach(c=>{if(c.gone)return;if(!(coachWait&&S.today.served===0))c.p-=dt;const r=Math.max(0,c.p/c.mp);
      if(c.bar){c.bar.style.width=(r*100)+'%';c.bar.style.background=r>.5?'#2FA36B':r>.25?'#F2B33D':'#FF6F61'}
      const m=r>.5?'happy':r>.25?'ok':'sad';if(m!==c.mood){c.mood=m;const f=c.el&&c.el.querySelector('.face');if(f)f.outerHTML=faceSvg(c.lk,m)}
      if(c.p<=0)leave(c,'timeout')});
    if(R.pouring){R.cup.fill+=42*pace().pour*(R.cup.fill>62?.5:1)*dt;if(R.cup.fill>=100){R.cup.fill=0;R.cup.tea=null;R.cup.tops=[];R.cup.sugar=null;stopPour();drawCup();
        $('cup').classList.remove('shake');void $('cup').offsetWidth;$('cup').classList.add('shake');toast('Tràn ly rồi! Pha lại ly mới nhé','bad');snd('bad');buzz([60,40,60]);R.combo=0;comboUi()}
      else liqOnly()}
    if(R.t<DAY_LEN&&R.t>4&&!R.cup.tea&&!TEAS.some(x=>S.stock[x.id]>0)&&!R.custs.some(c=>!c.gone)){toast('Hết trà rồi, quán đóng cửa sớm','bad',2400);endDay();return}
    const k=Math.min(1,R.t/DAY_LEN);$('clk').style.width=(k*100)+'%';
    const mins=8*60+Math.floor(k*13*60);const sub=$('hSub');if(sub)sub.textContent=Math.floor(mins/60)+':'+String(mins%60).padStart(2,'0');
    if(R.t>=DAY_LEN&&!R.custs.some(c=>!c.gone)){endDay();return}}
  R.raf=requestAnimationFrame(loop)}

function pauseDlg(){if(!R)return;R.paused=true;stopPour();
  sheet(`<h3>Tạm nghỉ</h3><p>Khách đang đứng chờ bạn quay lại.</p>

function endDay(){if(!R||R.ended)return;R.ended=true;cancelAnimationFrame(R.raf);const cmb=$('combo');if(cmb)cmb.remove();
  R.custs.forEach(c=>c.gone=true);
  const t=S.today;
  let spoilN=0,spoilV=0;if(!S.upg.tu_mat)TEAS.forEach(x=>{if(S.stock[x.id]>0){spoilN+=S.stock[x.id];spoilV+=S.stock[x.id]*x.cost;S.stock[x.id]=0}});

  S.stats.days++;S.day++;checkBadges();S.sum.newB=(t.newB||[]).slice();newDay();S.phase='summary';save();

function renderSummary(){S.phase='summary';head();const s=S.sum;

function b64e(str){const u=new TextEncoder().encode(str);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64d(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
function backupDlg(){const d={...S};delete d.sum;const code='MAY1.'+b64e(JSON.stringify(d));
  sheet(`<h3>Sao lưu</h3><p>Chép đoạn mã này, dán vào ghi chú hoặc gửi qua Zalo cho chính mình. Muốn chơi tiếp ở máy khác thì mở game, chọn Khôi phục và dán mã vào.</p>
    <textarea id="bkT" readonly>${code}</textarea><div class="row2"><button class="sbtn" id="cpBtn">Chép mã</button><button class="big" id="okB" style="width:auto">Xong</button></div>`,S.phase==='sell'?()=>pauseDlg():null);
  $('cpBtn').onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(code);ok=true}catch(e){}
    if(!ok){const t=$('bkT');t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}}toast(ok?'Đã chép mã':'Nhấn giữ vào ô mã để chép',ok?'good':'')};
  $('okB').onclick=closeSheet}
function restoreDlg(){sheet(`<h3>Khôi phục</h3><p>Dán mã sao lưu (bắt đầu bằng MAY1.) vào ô dưới. Tiến trình hiện tại trên máy này sẽ bị thay thế.</p>
    <textarea id="rsT" placeholder="MAY1...."></textarea><div class="row2"><button class="sbtn" id="rsNo">Thôi</button><button class="big" id="rsGo" style="width:auto">Khôi phục</button></div>`,S.phase==='sell'?()=>pauseDlg():null);
  $('rsNo').onclick=closeSheet;
  $('rsGo').onclick=()=>{const v=($('rsT').value||'').replace(/\s+/g,'');if(!/^MAY1\./.test(v)){toast('Mã phải bắt đầu bằng MAY1.','bad');return}
    try{const d=JSON.parse(b64d(v.slice(5)));if(!d||!d.v||!d.stock)throw 0;
      if(R){R.ended=true;cancelAnimationFrame(R.raf);R=null}
      const f=fresh();S={...f,...d,stock:{...f.stock,...d.stock},unl:{...f.unl,...d.unl},stats:{...f.stats,...d.stats}};
      S.sum=null;S.started=true;if(!S.today)newDay();S.phase='prep';save();hideSheet();toast('Đã khôi phục '+S.name,'good');renderPrep()}
    catch(e){toast('Mã bị lỗi hoặc thiếu chữ. Chép lại cho đủ nhé.','bad',2600)}}}

/* ===================== KHỞI ĐỘNG ===================== */
S=load();
document.addEventListener('touchstart',()=>{},{passive:true});
addEventListener('pagehide',save);
addEventListener('orientationchange',()=>{if(R&&!R.ended&&!R.paused&&S.phase==='sell')pauseDlg()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R&&!R.ended&&!R.paused&&S.phase==='sell')pauseDlg()});
if(!S.started)renderSplash();
else if(S.phase==='sell'){ /* đang bán mà tải lại trang: coi như đóng cửa ngày đó */
  R={custs:[],ended:false,raf:0};S.today=S.today||newToday();endDay();}
else if(S.phase==='summary'&&S.sum)renderSplash();
else renderSplash();
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
